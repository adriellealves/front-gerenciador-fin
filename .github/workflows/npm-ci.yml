name: npm-ci

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: npm-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate version tag
        run: |
          current_version=$(node -p "require('./package.json').version")

          if git tag --list "v${current_version}" | grep -q . || git tag --list "${current_version}" | grep -q .; then
            echo "Version ${current_version} already exists as a Git tag. Bump package.json before building again."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
